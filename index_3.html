<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>Orbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* ============ TOKENS (shared with Life OS: dark blue/teal) ============ */
:root{
  --bg:#07090d; --bg-2:#0b0f15; --surface:#0f141c; --surface-2:#151c26; --surface-3:#1c2531;
  --line:#1d2632; --line-2:#2b3646;
  --text:#e7edf4; --text-2:#a9b5c3; --muted:#6c7989;
  --blue:#3b82f6; --blue-2:#6aa2ff; --teal:#1fc8b4;
  --ok:#2fbf71; --warn:#f5b642; --danger:#f0605d;
  --grad:linear-gradient(90deg,#3b82f6,#1fc8b4);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r-sm:8px; --r-md:11px; --r-lg:16px;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.35,.5,1);
  --t-orbit:.62s;
  --side-w:260px; --panel-w:352px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:22px 22px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue-2);outline-offset:2px}
[hidden]{display:none!important}
.ic{width:18px;height:18px;flex:none}
.ic.sm{width:15px;height:15px}
.mono{font-family:var(--mono)}

/* ============ SHELL ============ */
.app{display:grid;grid-template-columns:var(--side-w) 1fr;height:100dvh}
.side{background:rgba(11,15,21,.88);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px;
  padding:22px 12px calc(14px + env(safe-area-inset-bottom));min-height:0;backdrop-filter:blur(14px);z-index:45}
.brand{font-weight:800;font-size:22px;letter-spacing:.16em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 10px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 10px;height:36px;color:var(--muted)}
.search:focus-within{border-color:var(--blue)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text)}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1;min-height:0}
.nav-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:var(--text-2);width:100%}
.nav-item:hover{background:var(--surface)}
.nav-item.on{background:var(--surface-2);color:var(--text)}
.nav-item .count{margin-left:auto;font:500 11px var(--mono);color:var(--muted)}
.nav-item .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-sep{height:1px;background:var(--line);margin:8px 10px}
.c-goals{color:var(--teal)} .c-day{color:var(--warn)} .c-imp{color:#f2668b} .c-plan{color:var(--blue-2)} .c-link{color:var(--teal)} .c-all{color:var(--text-2)} .c-list{color:var(--muted)}
.newlist{display:flex;align-items:center;gap:11px;padding:8px 10px;color:var(--muted)}
.newlist input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text)}
.side-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px}
.pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border:1px solid var(--line-2);border-radius:999px;font-size:12px;font-weight:600;color:var(--text-2);background:var(--surface)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.ok .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)} .pill.saving .dot{background:var(--warn)} .pill.error .dot{background:var(--danger)}
.iconbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--text-2);flex:none}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.btn{height:36px;padding:0 14px;border-radius:9px;background:var(--blue);color:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.btn:hover{background:#4a8df8}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line-2)}
.btn.ghost:hover{background:var(--surface-3)}
.btn.good{background:rgba(47,191,113,.14);color:var(--ok);border:1px solid rgba(47,191,113,.35)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid rgba(240,96,93,.3)}
.btn.danger:hover{background:rgba(240,96,93,.08)}
.main{position:relative;min-width:0;min-height:0;overflow:hidden}
.view{position:absolute;inset:0;display:none;min-height:0}
.view.on{display:grid}
.h1{font-weight:800;font-size:34px;letter-spacing:.1em;text-transform:uppercase;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.menu-btn{display:none}

/* ============ GOALS VIEW ============ */
#goalsView{grid-template-columns:1fr var(--panel-w)}
.stage-wrap{display:grid;grid-template-rows:auto 1fr;min-width:0;min-height:0}
.ghead{display:flex;align-items:center;gap:12px;padding:24px 28px 0;flex-wrap:wrap}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:13px;color:var(--muted);flex:1 1 100%;min-height:24px}
.crumbs button{padding:3px 6px;border-radius:6px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumbs button:hover{color:var(--text);background:var(--surface)}
.crumbs .cur{color:var(--text);font-weight:600}
.stage{position:relative;overflow:hidden;min-height:0;outline:none}
.stage::before{content:"";position:absolute;left:50%;top:50%;width:70vmin;height:70vmin;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(closest-side,rgba(59,130,246,.10),transparent);pointer-events:none}
#links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.orbit-ring{fill:none;stroke:rgba(255,255,255,.05);stroke-width:1;stroke-dasharray:2 6}
.link{stroke:color-mix(in srgb,var(--h) 40%,transparent);stroke-width:1.5;fill:none;transition:stroke .2s,stroke-width .2s}
.link.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s var(--ease) forwards}
.link.task{stroke-width:1;stroke:color-mix(in srgb,var(--h) 25%,transparent)}
.link.add{stroke:rgba(255,255,255,.08);stroke-dasharray:3 5}
.link.hot{stroke:color-mix(in srgb,var(--h) 90%,transparent);stroke-width:2.2}
.link.parent{stroke:rgba(255,255,255,.12);stroke-dasharray:3 5}
@keyframes draw{to{stroke-dashoffset:0}}
.legend{position:absolute;left:24px;bottom:18px;display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--muted);pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:50%;display:inline-block}
.sw.s1{background:var(--blue);box-shadow:0 0 8px var(--blue)} .sw.s2{background:rgba(59,130,246,.25);border:1.5px solid rgba(59,130,246,.8)}
.sw.s3{border:1.5px solid var(--blue)} .sw.s4{width:7px;height:7px;background:var(--surface-3);border:1px solid var(--line-2)}
.hint{position:absolute;right:22px;bottom:18px;font-size:11.5px;color:var(--muted);text-align:right;pointer-events:none;max-width:260px}
.empty-cta{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--text-2)}
.empty-cta .row{display:flex;gap:8px}

/* bubbles */
.node{position:absolute;left:0;top:0;border-radius:50%;z-index:2;
  transition:transform var(--t-orbit) var(--ease),width var(--t-orbit) var(--spring),height var(--t-orbit) var(--spring),opacity .45s ease;
  will-change:transform}
.node.center{z-index:3}
.node.leaving{pointer-events:none;z-index:1}
.float{position:absolute;inset:0;border-radius:50%;animation:bob 6.5s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
.node.center .float,.node.parent .float{animation:none}
.body{position:absolute;inset:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;
  padding:15%;overflow:hidden;transition:transform .25s var(--ease),box-shadow .25s,background .3s,border-color .3s}
.node:hover .body{transform:scale(1.07)}
.node.center:hover .body{transform:scale(1.02)}
.node:active .body{transform:scale(.97)}
.ttl{font-weight:600;line-height:1.16;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;transition:font-size var(--t-orbit) var(--ease);word-break:break-word}
.center .ttl{font-size:17px;font-weight:700;-webkit-line-clamp:3}
.lbl{font-size:10.5px;font-weight:600;color:rgba(255,255,255,.7);letter-spacing:.02em}
.pct{font:700 11px var(--mono);opacity:.8}
.center .pct{font-size:13px}
.ext{position:absolute;top:calc(100% + 6px);left:0;white-space:nowrap;font-size:11.5px;color:var(--muted);pointer-events:none}
.ring{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);transform:rotate(-90deg);pointer-events:none;overflow:visible}
.ring circle{fill:none;stroke-width:3;vector-effect:non-scaling-stroke}
.ring .trk{stroke:rgba(255,255,255,.07)}
.ring .val{stroke:var(--h);stroke-linecap:round;filter:drop-shadow(0 0 4px var(--h))}
.sats{position:absolute;inset:-12px;border-radius:50%;animation:spin 48s linear infinite;pointer-events:none}
.sats i{position:absolute;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:color-mix(in srgb,var(--h) 80%,white 20%);opacity:.8}
.badge{position:absolute;right:6%;top:6%;width:22%;height:22%;min-width:16px;min-height:16px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#06140c;box-shadow:0 0 0 3px var(--bg)}
.badge svg{width:65%;height:65%}
@keyframes bob{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* tier treatments: hue = life area, fill = specificity */
.root .body{background:radial-gradient(circle at 32% 26%,#1f3252,#0e1624 72%);border:1px solid #2c4166;box-shadow:0 0 60px -12px rgba(59,130,246,.45)}
.t1 .body{background:radial-gradient(circle at 30% 24%,color-mix(in srgb,var(--h) 70%,white 30%),var(--h) 52%,color-mix(in srgb,var(--h) 62%,black 38%));
  box-shadow:0 12px 44px -12px var(--h),inset 0 -8px 20px rgba(0,0,0,.18);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.t2 .body{background:color-mix(in srgb,var(--h) 20%,var(--surface));border:1.5px solid color-mix(in srgb,var(--h) 72%,transparent);box-shadow:0 10px 36px -16px var(--h)}
.t3 .body{background:var(--surface-2);border:1.5px solid var(--h)}
.task .body{background:var(--surface);border:1px solid var(--line-2);padding:14%}
.task .ttl{font-size:10.5px;font-weight:500;-webkit-line-clamp:3}
.task .tchk{width:15px;height:15px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--h) 70%,white 10%);display:grid;place-items:center;flex:none}
.task.done .body{background:color-mix(in srgb,var(--h) 16%,var(--surface));border-color:color-mix(in srgb,var(--h) 45%,transparent)}
.task.done .tchk{background:var(--h);border-color:var(--h);color:#fff}
.task.done .ttl{text-decoration:line-through;opacity:.55}
.task .tchk svg{width:10px;height:10px}
.add .body,.addtask .body{border:1.5px dashed var(--line-2);color:var(--muted);background:rgba(15,20,28,.6)}
.add:hover .body,.addtask:hover .body{border-color:var(--blue-2);color:var(--text)}
.add .body,.addtask .body{padding:6%}
.add .ttl,.addtask .ttl{font-size:10.5px;font-weight:600;word-break:normal;white-space:nowrap}
.more .body{background:var(--surface);border:1px solid var(--line-2);color:var(--text-2)}
.center.t1 .body,.center.t2 .body,.center.t3 .body{box-shadow:0 0 0 8px color-mix(in srgb,var(--h) 10%,transparent),0 20px 70px -18px var(--h)}
.center.t3 .body{background:color-mix(in srgb,var(--h) 10%,var(--surface-2))}
.parent .body{background:var(--surface-2);border:1px solid var(--line-2);color:var(--text-2)}
.parent .body svg{width:45%;height:45%}
.achieved .body{filter:saturate(.75)}
.node.burst .body{animation:burst .55s var(--ease)}
@keyframes burst{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--h) 70%,transparent)}40%{transform:scale(1.22)}100%{transform:scale(1);box-shadow:0 0 0 22px transparent}}

.composer{position:absolute;z-index:6;transform:translate(-50%,-50%);display:flex;gap:6px;align-items:center;background:var(--surface-2);border:1px solid var(--blue);border-radius:12px;padding:6px;
  box-shadow:0 22px 60px -12px rgba(0,0,0,.7);animation:pop .22s var(--spring)}
.composer input{width:230px;max-width:52vw;height:34px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:8px;padding:0 10px;outline:0}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.85);opacity:0}}

/* goal panel */
.gpanel{border-left:1px solid var(--line);background:rgba(11,15,21,.86);overflow:auto;backdrop-filter:blur(14px);min-height:0;z-index:4}
.pp{padding:24px 20px 60px;display:flex;flex-direction:column;gap:16px}
.peek{display:none}
.ptier{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.ptier b{color:var(--text-2);font-weight:600}
.ptier button{color:var(--text-2);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.hdot{width:9px;height:9px;border-radius:50%;background:var(--h);box-shadow:0 0 8px var(--h);flex:none}
.ptitle{width:100%;background:none;border:0;outline:0;resize:none;font-size:22px;font-weight:700;line-height:1.25;overflow:hidden;padding:2px 0;border-radius:6px}
.ptitle:focus{box-shadow:0 0 0 1px var(--line-2);background:var(--surface)}
.pbar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--h,var(--blue));box-shadow:0 0 10px var(--h,var(--blue));transition:width .5s var(--ease)}
.pstat{font:500 11.5px var(--mono);color:var(--muted);display:flex;justify-content:space-between;margin-top:7px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.frow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);color:var(--text-2);min-height:46px}
.frow:first-child{border-top:0}
.frow .grow{flex:1;min-width:0}
.frow textarea,.frow input[type=text]{width:100%;background:none;border:0;outline:0;resize:none;color:var(--text)}
.frow input[type=date]{background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;height:32px;padding:0 8px;color:var(--text)}
.sel{background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;height:32px;padding:0 8px;color:var(--text);max-width:100%;min-width:0}
.swatches{display:flex;gap:8px}
.swatch{width:22px;height:22px;border-radius:50%;background:var(--h);box-shadow:0 0 0 2px var(--surface)}
.swatch.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--h)}
.sec-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--text-2);margin:4px 0 8px}
.sec-h .n{font:500 11px var(--mono);color:var(--muted)}
.grow-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;width:100%;color:var(--text)}
.grow-row:hover{background:var(--surface-2)}
.grow-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow-row .mini{width:44px;height:4px;border-radius:9px;background:var(--surface-3);overflow:hidden;flex:none}
.grow-row .mini i{display:block;height:100%;background:var(--h)}
.grow-row .pc{font:500 11px var(--mono);color:var(--muted);width:34px;text-align:right}
.addrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--muted);border:1px dashed var(--line-2);margin-top:6px}
.addrow:focus-within{border-color:var(--blue);border-style:solid}
.addrow input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text)}
.muted{color:var(--muted)}
.small{font-size:12px}

/* ============ TASKS VIEW ============ */
#tasksView{grid-template-rows:auto 1fr}
.thead{padding:24px 32px 6px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.thead .tt{flex:1;min-width:220px}
.thead .h1 input{all:unset;width:100%}
.tsub{color:var(--muted);font-size:13px;margin-top:8px}
.tools{display:flex;gap:6px;align-items:center}
.tbody{overflow:auto;padding:6px 32px 140px;min-height:0}
.tcol{max-width:860px}
.addbar{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:10px 0 16px;overflow:hidden}
.addbar:focus-within{border-color:var(--blue)}
.addbar .top{display:flex;align-items:center;gap:12px;padding:0 10px 0 14px;height:50px;color:var(--blue-2)}
.addbar .top input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font-size:14.5px}
.addbar .opts{display:none;align-items:center;gap:6px;padding:6px 10px 8px;border-top:1px solid var(--line);flex-wrap:wrap}
.addbar:focus-within .opts,.addbar.has .opts{display:flex}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line-2);color:var(--text-2);font-size:12px;background:var(--surface-2);position:relative}
.chip.on{color:var(--text);border-color:var(--blue)}
.chip input[type=date]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.chip select{all:unset;cursor:pointer;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:6px;cursor:pointer;
  transition:background .15s,opacity .35s,transform .35s var(--ease)}
.trow:hover{background:var(--surface-2)}
.trow.open{border-color:var(--blue)}
.chk{width:22px;height:22px;border-radius:50%;border:1.8px solid #45526a;display:grid;place-items:center;flex:none;color:transparent;transition:all .2s}
.chk svg{width:13px;height:13px}
.chk:hover{border-color:var(--blue-2);color:var(--blue-2)}
.trow.done .chk,.chk.on{background:var(--blue);border-color:var(--blue);color:#fff}
.trow.done .ttitle{text-decoration:line-through;color:var(--muted)}
.trow.leaving{opacity:0;transform:translateX(18px)}
.tmain{flex:1;min-width:0}
.ttitle{overflow:hidden;text-overflow:ellipsis;word-break:break-word}
.tmeta{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12px;color:var(--muted);margin-top:2px}
.meta{display:inline-flex;align-items:center;gap:4px}
.meta .ic{width:13px;height:13px}
.meta.over{color:var(--danger)} .meta.today{color:var(--blue-2)}
.gchip{display:inline-flex;align-items:center;gap:6px;max-width:220px}
.gchip .hdot{width:7px;height:7px}
.gchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{color:var(--muted);flex:none}
.star:hover{color:var(--text)}
.star.on{color:var(--warn)}
.star.on svg{fill:currentColor}
.sec-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--text-2);margin:18px 0 8px;padding:4px 8px 4px 4px;border-radius:7px}
.sec-toggle:hover{background:var(--surface)}
.sec-toggle .ic{transition:transform .2s}
.sec-toggle.closed .ic{transform:rotate(-90deg)}
.group-h{font-size:12.5px;font-weight:600;color:var(--text-2);margin:18px 0 8px 4px}
.group-h.over{color:var(--danger)}
.suggest{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:rgba(245,182,66,.04)}
.suggest .srow{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px}
.suggest .srow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:16px;color:var(--text-2);font-weight:600;margin-bottom:6px}

/* ============ DRAWER ============ */
.scrim{position:fixed;inset:0;background:rgba(3,5,8,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg-2);border-left:1px solid var(--line);transform:translateX(102%);
  transition:transform .34s var(--ease);z-index:51;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.drawer.on{transform:none}
.dhead{display:flex;align-items:center;gap:8px;padding:12px 12px 4px;color:var(--muted);font-size:12px}
.dhead .where{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbody{overflow:auto;padding:8px 16px 20px;display:flex;flex-direction:column;gap:12px;flex:1}
.dtitle{display:flex;align-items:flex-start;gap:12px;padding:14px}
.dtitle textarea{flex:1;background:none;border:0;outline:0;resize:none;font-size:18px;font-weight:650;line-height:1.3;overflow:hidden}
.dtitle .chk{margin-top:3px}
.step{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line)}
.step .chk{width:18px;height:18px}
.step .chk svg{width:11px;height:11px}
.step input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text)}
.step.done input{text-decoration:line-through;color:var(--muted)}
.step .x{opacity:0;color:var(--muted)}
.step:hover .x,.step .x:focus{opacity:1}
.qchips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 12px 44px}
.qchips button{height:26px;padding:0 10px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line-2);font-size:12px;color:var(--text-2)}
.qchips button:hover{color:var(--text)}
.frow.on{color:var(--blue-2)}
.dfoot{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}

/* ============ TOAST / AUTH / MOBILE NAV ============ */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--surface-3);border:1px solid var(--line-2);border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:14px;z-index:70;
  transition:all .25s var(--ease);box-shadow:0 20px 50px -10px rgba(0,0,0,.6);font-size:13px}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--blue-2);font-weight:600}
.auth{position:fixed;inset:0;display:none;place-items:center;z-index:80;background:var(--bg);background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:22px 22px}
.auth.on{display:grid}
.auth .box{width:min(360px,92vw);display:flex;flex-direction:column;gap:12px}
.auth .brand{font-size:40px;padding:0;margin-bottom:6px}
.auth input{height:44px;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:0 14px;outline:0}
.auth input:focus{border-color:var(--blue)}
.auth .err{color:var(--danger);font-size:12.5px;min-height:18px}
.auth .err.info{color:var(--text-2)}
.passwrap{position:relative;display:flex}
.passwrap input{flex:1;padding-right:64px}
.showpass{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:600;color:var(--text-2);padding:6px 8px;border-radius:6px}
.showpass:hover{color:var(--text);background:var(--surface-2)}
.linkbtn{align-self:center;font-size:12.5px;color:var(--muted);padding:6px}
.linkbtn:hover{color:var(--text)}
.bnav{display:none}
.side-scrim{display:none}

@media (max-width:1180px){:root{--panel-w:308px}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);transform:translateX(-102%);transition:transform .3s var(--ease);padding-top:calc(20px + env(safe-area-inset-top))}
  .side.open{transform:none}
  .side-scrim{display:block;position:fixed;inset:0;background:rgba(3,5,8,.55);z-index:44;opacity:0;pointer-events:none;transition:opacity .25s}
  .side-scrim.on{opacity:1;pointer-events:auto}
  .menu-btn{display:grid}
  .h1{font-size:26px}
  .ghead{padding:calc(14px + env(safe-area-inset-top)) 16px 0}
  #goalsView{grid-template-columns:1fr}
  .stage-wrap{padding-bottom:150px}
  .legend,.hint{display:none}
  .gpanel{position:absolute;left:0;right:0;bottom:0;max-height:78%;border-left:0;border-top:1px solid var(--line-2);border-radius:20px 20px 0 0;
    transform:translateY(calc(100% - 146px - env(safe-area-inset-bottom)));transition:transform .35s var(--ease);background:rgba(11,15,21,.97)}
  .gpanel.open{transform:none}
  .gpanel:not(.open) .pp{visibility:hidden;opacity:0}
  .pp{transition:opacity .25s}
  .peek{display:flex;align-items:center;gap:10px;padding:10px 18px 12px;position:sticky;top:0;background:rgba(11,15,21,.97);z-index:2;width:100%;border-radius:20px 20px 0 0}
  .peek::before{content:"";position:absolute;left:50%;top:6px;width:36px;height:4px;border-radius:9px;background:var(--line-2);transform:translateX(-50%)}
  .peek .t{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:6px}
  .peek .p{font:700 12px var(--mono);color:var(--text-2);margin-top:6px}
  .peek .ic{margin-top:6px;transition:transform .3s}
  .gpanel.open .peek .ic{transform:rotate(180deg)}
  .pp{padding:4px 18px 120px}
  .thead{padding:calc(14px + env(safe-area-inset-top)) 16px 4px}
  .tbody{padding:6px 16px 140px}
  .bnav{display:flex;position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;gap:2px;padding:6px;
    background:rgba(15,20,28,.92);border:1px solid var(--line-2);border-radius:18px;backdrop-filter:blur(14px);box-shadow:0 16px 40px -10px rgba(0,0,0,.7)}

  .step .x{opacity:1}

}
@media (prefers-reduced-motion:reduce){

  .link.draw{animation:none;stroke-dashoffset:0}
  .node.burst .body{animation:none}
  *{transition-duration:.01s!important}
}

<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand">ORBIT</div>
    <label class="search"><svg class="ic sm" data-i="search"></svg><input id="search" type="search" placeholder="Search tasks" autocomplete="off"></label>

      <button class="iconbtn" id="logoutBtn" data-act="logout" title="Sign out" hidden><svg class="ic" data-i="logout"></svg></button></div>
  </aside>

          <div class="hint">Tap a bubble to go deeper. Tap a task bubble to check it off. Esc goes back up.</div>
        </div>

    </section>

    <section class="view" id="tasksView">
      <header class="thead" id="thead"></header>
      <div class="tbody"><div class="tcol" id="tlist"></div></div>
    </section>
  </main>
</div>

<nav class="bnav" id="bnav"></nav>
<div class="scrim" id="scrim" data-act="closeDrawer"></div>
<aside class="drawer" id="drawer" aria-label="Task details"></aside>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>

<div class="auth" id="auth">
  <div class="box">
    <div class="brand">ORBIT</div>
    <div class="muted" style="margin-bottom:8px">Goals that break down into tasks you can actually do.</div>
    <input id="authEmail" type="email" placeholder="Email" autocomplete="email">
    <div class="passwrap"><input id="authPass" type="password" placeholder="Password" autocomplete="current-password"><button class="showpass" data-act="showPass" type="button">Show</button></div>
    <div class="err" id="authErr"></div>
    <button class="btn" data-act="signIn" id="authPrimary">Sign in</button>
    <button class="btn ghost" data-act="signUp" id="authSecondary">Create account</button>
    <button class="linkbtn" data-act="forgot" id="authForgot">Forgot password?</button>
  </div>
</div>

<script>
/* =====================================================================
   CONFIG — paste your Orbit Supabase project values here.
   Live mode turns on only on github.io with these filled in.
   Anywhere else (Claude preview, local file) it runs on localStorage.
   ===================================================================== */
var SUPABASE_URL = 'YOUR_SUPABASE_URL';
var SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

/* ---------------- utils ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const parseD = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const dayDiff = s => Math.round((parseD(s) - parseD(today())) / 864e5);
const nowIso = () => new Date().toISOString();
const fmtShort = s => parseD(s).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const fmtLong = s => parseD(s).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
const hash = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); };

/* ---------------- icons ---------------- */
const IC = {
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>',
  star: '<path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/>',
  cal: '<rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
  home: '<path d="M3 10l9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  target: '<circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="1.5"/>',
  layers: '<path d="M12 2.5L2.5 7.5 12 12.5l9.5-5z"/><path d="M2.5 12.5L12 17.5l9.5-5M2.5 17L12 22l9.5-5"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  check: '<path d="M20 6.5L9 17.5l-5-5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  trash: '<path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
  x: '<path d="M18 6L6 18M6 6l12 12"/>',
  repeat: '<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>',
  note: '<path d="M14 2.5H6a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8.5z"/><path d="M14 2.5v6h6M8 13h8M8 17h5"/>',
  menu: '<path d="M3 6h18M3 12h18M3 18h18"/>',
  right: '<path d="M9 18l6-6-6-6"/>',
  down: '<path d="M6 9l6 6 6-6"/>',
  up: '<path d="M18 15l-6-6-6 6"/>',
  back: '<path d="M15 18l-6-6 6-6"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  pencil: '<path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>',
  sort: '<path d="M3 6h13M3 12h9M3 18h5M17 10v10M14 17l3 3 3-3"/>',
  steps: '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>'
};
const icon = (n, cls) => '<svg class="ic ' + (cls || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + IC[n] + '</svg>';
function hydrateIcons(root) { $$('svg[data-i]', root).forEach(s => { s.outerHTML = icon(s.dataset.i, s.getAttribute('class').replace('ic', '').trim()); }); }

/* ---------------- design tokens used by JS ---------------- */
const HUES = { blue: '#3b82f6', teal: '#1fc8b4', coral: '#ff7a59', amber: '#f5b642', violet: '#9b8cff', rose: '#f2668b' };
const HUE_KEYS = Object.keys(HUES);
const TIER = { 1: 'Vision', 2: 'Milestone', 3: 'Objective' };
const CHILD_NAME = { 0: 'Visions', 1: 'Milestones', 2: 'Objectives' };
const CHILD_ONE = { 0: 'vision', 1: 'milestone', 2: 'objective' };
const REPEATS = { '': 'Does not repeat', daily: 'Daily', weekdays: 'Weekdays', weekly: 'Weekly', monthly: 'Monthly', yearly: 'Yearly' };

/* ---------------- state ---------------- */
let S = { goals: [], lists: [], tasks: [] };
const UI = { view: 'goals', focus: null, prevFocusKey: null, q: '', openTask: null, sorts: {}, showDone: {}, composer: null, burst: null, renaming: false, draft: { due: null, important: false, goal: '' } };

/* ---------------- storage (dual mode) ---------------- */
const LS_KEY = 'orbit.v1';
const COLS = {
  goals: ['id', 'parent_id', 'tier', 'title', 'note', 'color', 'target_date', 'done', 'sort', 'created_at'],
  lists: ['id', 'name', 'sort', 'created_at'],
  tasks: ['id', 'list_id', 'goal_id', 'title', 'note', 'done', 'done_at', 'important', 'due', 'my_day', 'repeat', 'steps', 'sort', 'created_at']
};
function clean(table, row) {
  const o = {};
  COLS[table].forEach(k => { let v = row[k]; if (v === '' && /date|due|my_day|_at|repeat|parent_id|goal_id|list_id/.test(k)) v = null; o[k] = v === undefined ? null : v; });
  return o;
}
const Store = {
  live: false, sb: null, user: null, q: Promise.resolve(), timers: {}, pending: 0,
  loadLocal() { try { const raw = localStorage.getItem(LS_KEY); if (raw) { const d = JSON.parse(raw); S.goals = d.goals || []; S.lists = d.lists || []; S.tasks = d.tasks || []; return true; } } catch (e) {} return false; },
  persistLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} },
  save(table, row, delay) {
    if (!this.live) { this.persistLocal(); return; }
    const k = table + row.id; clearTimeout(this.timers[k]);
    const go = () => { delete this.timers[k]; this.enqueue(() => this.sb.from(table).upsert(clean(table, row))); };
    if (delay) { this.timers[k] = setTimeout(go, delay); setSync('saving'); } else go();
  },
  del(table, id) {
    if (!this.live) { this.persistLocal(); return; }
    clearTimeout(this.timers[table + id]);
    this.enqueue(() => this.sb.from(table).delete().eq('id', id));
  },
  enqueue(fn) {
    this.pending++; setSync('saving');
    this.q = this.q.then(fn).then(res => { if (res && res.error) throw res.error; })
      .then(() => { if (--this.pending <= 0) { this.pending = 0; setSync('ok'); } })
      .catch(err => { this.pending = Math.max(0, this.pending - 1); setSync('error', err.message || String(err)); console.error(err); });
  },
  async loadRemote() {
    const res = await Promise.all(['goals', 'lists', 'tasks'].map(n => this.sb.from(n).select('*')));
    res.forEach(r => { if (r.error) throw r.error; });
    S.goals = res[0].data; S.lists = res[1].data; S.tasks = res[2].data.map(t => Object.assign(t, { steps: t.steps || [] }));
  }
};
function setSync(state, msg) {
  const el = $('#sync'); el.className = 'pill ' + (state === 'local' ? '' : state);
  $('#syncText').textContent = { local: 'Local only', ok: 'Synced', saving: 'Saving', error: 'Sync error' }[state];
  el.title = msg || (state === 'local' ? 'Data is stored in this browser' : '');
}

/* ---------------- model helpers ---------------- */
const G = id => S.goals.find(g => g.id === id);
const T = id => S.tasks.find(t => t.id === id);
const L = id => S.lists.find(l => l.id === id);
const bySort = (a, b) => ((a.sort || 0) - (b.sort || 0)) || String(a.created_at).localeCompare(String(b.created_at));
const kidsOf = id => S.goals.filter(g => (g.parent_id || null) === (id || null)).sort(bySort);
const tasksOf = id => S.tasks.filter(t => t.goal_id === id);
function descIds(id) { const out = [id]; kidsOf(id).forEach(k => out.push.apply(out, descIds(k.id))); return out; }
function visionOf(g) { let n = 0; while (g && g.parent_id && n++ < 5) { const p = G(g.parent_id); if (!p) break; g = p; } return g; }
function hueOf(g) { const v = g && visionOf(g); return HUES[(v && v.color) || 'blue'] || HUES.blue; }
function pathOf(id) { const out = []; let g = G(id), n = 0; while (g && n++ < 5) { out.unshift(g); g = g.parent_id ? G(g.parent_id) : null; } return out; }
let _pc = null;
function invalidate() { _pc = null; }
function prog(id) {
  if (!_pc) _pc = new Map();
  const key = id || 'root'; if (_pc.has(key)) return _pc.get(key);
  let v;
  const g = id ? G(id) : null;
  if (g && g.done) v = 1;
  else {
    const parts = kidsOf(id).map(k => prog(k.id)).concat(id ? tasksOf(id).map(t => t.done ? 1 : 0) : []);
    v = parts.length ? parts.reduce((a, b) => a + b, 0) / parts.length : 0;
  }
  _pc.set(key, v); return v;
}
const pct = id => Math.round(prog(id) * 100);
function branchTasks(id) { const ids = new Set(id ? descIds(id) : S.goals.map(g => g.id)); return S.tasks.filter(t => t.goal_id && ids.has(t.goal_id)); }

/* ---------------- mutations ---------------- */
function nextColor() { const used = kidsOf(null).map(v => v.color); return HUE_KEYS.find(k => used.indexOf(k) < 0) || HUE_KEYS[used.length % HUE_KEYS.length]; }
function addGoal(parentId, title, extra) {
  const p = parentId ? G(parentId) : null; const tier = p ? p.tier + 1 : 1; if (tier > 3) return null;
  const sibs = kidsOf(parentId);
  const g = Object.assign({ id: uid(), parent_id: parentId || null, tier: tier, title: title, note: '', color: tier === 1 ? nextColor() : null, target_date: null, done: false,
    sort: (sibs.length ? Math.max.apply(null, sibs.map(s => s.sort || 0)) : 0) + 1, created_at: nowIso() }, extra || {});
  S.goals.push(g); Store.save('goals', g); return g;
}
function updateGoal(g, patch, delay) { Object.assign(g, patch); Store.save('goals', g, delay); }
function deleteGoal(id) {

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.gfield === 'target_date') { updateGoal(G(UI.focus), { target_date: el.value || null }); return; }
  if (el.dataset.gfield === 'title' && !el.value.trim()) { el.value = 'Untitled'; updateGoal(G(UI.focus), { title: 'Untitled' }); render(); return; }
  if (el.dataset.tfield && el.tagName !== 'TEXTAREA') {
    const t = T(UI.openTask); const f = el.dataset.tfield; updateTask(t, { [f]: el.value || null });
    $('#drawer').dataset.id = ''; render(); return;
  }
  if (el.dataset.actChange === 'sort') { UI.sorts[UI.view] = el.value; renderTasks(); return; }
  if (el.id === 'draftDue') { UI.draft.due = el.value || null; render(); $('#addInput').focus(); return; }
  if (el.id === 'draftGoal') { UI.draft.goal = el.value; render(); $('#addInput').focus(); return; }
});
document.addEventListener('keydown', e => {
  const el = e.target;
  if (e.key === 'Enter' && !e.shiftKey) {
    if (el.id === 'authEmail' || el.id === 'authPass') { e.preventDefault(); authSubmit($('#authPrimary').dataset.act); return; }
    if (el.id === 'addInput') { e.preventDefault(); addFromBar(); return; }
    if (el.id === 'composerInput') { e.preventDefault(); composerSubmit(); return; }
    if (el.id === 'newList' && el.value.trim()) {
      const l = { id: uid(), name: el.value.trim(), sort: S.lists.length + 1, created_at: nowIso() }; S.lists.push(l); Store.save('lists', l); el.value = ''; el.blur(); setView('list:' + l.id); return;
    }
    if (el.id === 'renameInput') { el.blur(); return; }
    if (el.dataset.add && el.value.trim()) {
      e.preventDefault();
      if (el.dataset.add === 'goal') addGoal(UI.focus, el.value.trim()); else addTask({ goal_id: UI.focus, title: el.value.trim() });
      el.value = ''; render(); return;
    }
    if (el.id === 'addStep' && el.value.trim()) { const t = T(UI.openTask); updateTask(t, { steps: (t.steps || []).concat([{ id: uid(), t: el.value.trim(), done: false }]) }); el.value = ''; $('#drawer').dataset.id = ''; render(); return; }
    if (el.matches('.ptitle,textarea[data-tfield="title"]')) { e.preventDefault(); el.blur(); return; }
  }
  if (e.key === 'Escape') {
    if (el.id === 'renameInput') { UI.renaming = false; renderTasks(); return; }
    if (UI.composer) { UI.composer = null; removeComposer(); return; }
    if (UI.openTask) { UI.openTask = null; render(); return; }
    if ($('#side').classList.contains('open')) { closeSide(); return; }
    if ($('#gpanel').classList.contains('open')) { $('#gpanel').classList.remove('open'); return; }
    if (UI.view === 'goals' && UI.focus && !el.matches('input,textarea,select')) { setFocus(G(UI.focus).parent_id); return; }
  }
  if (UI.view === 'goals' && el.classList && el.classList.contains('node') && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    e.preventDefault();
    const list = $$('#nodes .node:not(.leaving):not(.parent):not(.center)');
    const i = list.indexOf(el); const n = list[(i + (e.key === 'ArrowRight' ? 1 : -1) + list.length) % list.length]; if (n) n.focus();
  }
  if (UI.view === 'goals' && e.key === 'Backspace' && UI.focus && !el.matches('input,textarea,select')) { e.preventDefault(); setFocus(G(UI.focus).parent_id); }
});
document.addEventListener('focusout', e => {
  const el = e.target;
  if (el.id === 'renameInput') {
    const l = L(UI.view.slice(5)); if (l && el.value.trim()) { l.name = el.value.trim(); Store.save('lists', l); }
    UI.renaming = false; setTimeout(render, 0);
  }
  if (el.dataset && (el.dataset.gfield === 'title' || el.dataset.tfield === 'title')) setTimeout(() => { if (!document.activeElement || !document.activeElement.dataset || !document.activeElement.dataset.gfield) render(); }, 0);
});
new ResizeObserver(() => { if (UI.view === 'goals') renderStage(); }).observe($('#stage'));

/* =====================================================================
   BOOT (auto-detect preview vs live GitHub Pages)
   ===================================================================== */
function startApp() { hydrateIcons(document); render(); }
let started = false;
async function startLive() {
  $('#auth').classList.remove('on'); $('#logoutBtn').hidden = false; setSync('saving');
  try { await Store.loadRemote(); setSync('ok'); } catch (err) { setSync('error', err.message); }
  startApp();
}
function authMsg(text, info) { const e = $('#authErr'); e.textContent = text || ''; e.classList.toggle('info', !!info); }
function showAuth(mode) {
  $('#auth').classList.add('on'); $('#logoutBtn').hidden = true; S = { goals: [], lists: [], tasks: [] };
  const rec = mode === 'recover';
  $('#authEmail').hidden = rec; $('#authSecondary').hidden = rec; $('#authForgot').hidden = rec;
  $('#authPass').placeholder = rec ? 'New password (6+ characters)' : 'Password';
  $('#authPass').autocomplete = rec ? 'new-password' : 'current-password';
  $('#authPrimary').dataset.act = rec ? 'setPass' : 'signIn';
  $('#authPrimary').textContent = rec ? 'Save new password' : 'Sign in';
  authMsg(rec ? 'Choose a new password to finish resetting.' : '', rec);
  (rec ? $('#authPass') : $('#authEmail')).focus();
}
async function authSubmit(kind) {
  const email = $('#authEmail').value.trim(), password = $('#authPass').value; authMsg('');
  const btn = $('#authPrimary');
  if (kind === 'setPass') {
    if (password.length < 6) { authMsg('Use at least 6 characters.'); return; }
    btn.disabled = true; const r = await Store.sb.auth.updateUser({ password: password }); btn.disabled = false;
    if (r.error) { authMsg(r.error.message); return; }
    Store.recovering = false; history.replaceState(null, '', location.pathname);
    Store.user = r.data.user; startLive(); return;
  }
  if (!email || !password) { authMsg('Enter your email and password.'); return; }
  btn.disabled = true;
  const res = kind === 'signUp' ? await Store.sb.auth.signUp({ email: email, password: password, options: { emailRedirectTo: location.origin + location.pathname } })
                                : await Store.sb.auth.signInWithPassword({ email: email, password: password });
  btn.disabled = false;
  if (res.error) { authMsg(res.error.message); return; }
  if (!res.data.session) { authMsg('Account created. Check your email to confirm, then sign in.', true); return; }
  Store.user = res.data.session.user; startLive();
}
async function sendReset() {
  const email = $('#authEmail').value.trim();
  if (!email) { authMsg('Enter your email first, then tap Forgot password.'); return; }
  const r = await Store.sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  authMsg(r.error ? r.error.message : 'Reset link sent. Open it on this device to set a new password.', !r.error);
}
(async function boot() {
  const configured = SUPABASE_URL.indexOf('YOUR_') !== 0;
  const live = configured && /github\.io$/.test(location.hostname) && window.supabase;
  if (live) {
    Store.live = true; Store.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    hydrateIcons(document);
    Store.recovering = /type=recovery/.test(location.hash);
    Store.sb.auth.onAuthStateChange((ev) => {
      if (ev === 'SIGNED_OUT') showAuth();
      if (ev === 'PASSWORD_RECOVERY') { Store.recovering = true; showAuth('recover'); }
    });
    const { data } = await Store.sb.auth.getSession();
    if (Store.recovering) showAuth('recover');
    else if (data.session) { Store.user = data.session.user; startLive(); }
    else showAuth();
  } else {
    const had = Store.loadLocal();
    if (!had) seedExample();
    Store.persistLocal(); setSync('local'); startApp();
  }
})();
</script>
